# The linters of `just lint`: reuse on the runner, as in gallia; the
# others need GTK (mypy also pycairo for its type stubs).

name: linters

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run reuse lint
        run: uvx reuse lint

  linters:
    runs-on: ubuntu-latest
    container: debian:trixie

    env:
      UV_PYTHON_PREFERENCE: only-managed
      UV_RUN_ARGS: --locked --with pygobject --with pycairo

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python-version: "3.14"

      # ty only looks into the project's environment, not into the one of
      # `uv run --with`: it gets the directory of PyGObject and pycairo
      - name: Run the linters
        run: |
          site=$(uv run $UV_RUN_ARGS python -c \
            'import cairo, os; print(os.path.dirname(os.path.dirname(cairo.__file__)))')
          TY_ARGS="--extra-search-path $site" just ruff mypy ty
